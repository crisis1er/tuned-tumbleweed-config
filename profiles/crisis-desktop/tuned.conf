#
# Custom tuned profile — crisis-desktop
# Base    : balanced (schedutil governor + sched_autogroup)
# Usage   : streaming (Kodi, QMPlay2), web development, KVM, Squid/Unbound
# Power   : AC only — no battery saving compromises
#

[main]
summary=Optimized desktop profile for streaming, KVM and network stack — AC only
include=balanced

# --- CPU ---
# Keep schedutil (inherited from balanced), explicitly enable AMD boost
[cpu]
governor=schedutil
energy_performance_preference=balance_performance
boost=1

[sysctl]
# Confirm swappiness for zram — redundant with sysctl.d/99-custom.conf by design
# Prevents drift back to kernel default (60) on profile reload
vm.swappiness=30

# Note: kernel.sched_*_ns removed in kernel 6.6+ (EEVDF scheduler, not exposed via sysctl)

# --- Disk ---
# High readahead for all devices (sdb=USB SSD boot, sda=HDD unused, sr0=optical)
[disk]
readahead=>4096

# --- SCSI host / ALPM ---
# Override balanced [scsi_host] which applies ALPM to ALL hosts including host2
# host2 = sdb (Samsung T7 USB SSD) — no link_power_management_policy sysfs file
# host0 = sda (SATA HDD), host1 = sr0 (SATA optical) — ALPM supported
[scsi_host]
devices=host0,host1
alpm=med_power_with_dipm

# --- Audio ---
# timeout=-1   : negative value → _set_timeout() skips sysfs write and returns None
#                → tuned verify() skips the timeout check entirely (new_value=None)
#                → overrides balanced's timeout=10 without writing to sysfs
#                → actual power_save=0 is set by modprobe.d and reinforced by script.sh
# reset_controller=false : writes '0' → both sides normalize to '' via _norm_value() → PASS
#                          (tuned _norm_value bug: _norm_value(0)='' vs _norm_value('0\n')='\n')
[audio]
timeout=-1
reset_controller=false

# --- Script ---
# Reinforces audio power_save=0 directly in sysfs after plugins run
# Workaround: tuned audio plugin verify has a bug with timeout=0
# (reads sysfs value as empty string — script verify() bypasses this)
[script]
script=${i:PROFILE_DIR}/script.sh

# --- Video ---
# panel_power_savings=0  : no screen dimming on AC power
# radeon_powersave       : dpm-performance — full GPU clock for hardware video decoding
#                          overrides dpm-balanced inherited from balanced profile
[video]
panel_power_savings=0
radeon_powersave=dpm-performance, auto
