#
# Profil tuned personnalisé — crisis-desktop
# Base : desktop (balanced → schedutil natif + sched_autogroup)
# Usage : streaming (Kodi, qmplayer2, YouTube), HTML, KVM, Squid/Unbound
# Alimentation : secteur uniquement
#

[main]
summary=Profil desktop optimisé streaming/KVM/réseau — AC uniquement
include=balanced

# --- CPU ---
# Conserver schedutil (hérité de balanced), activer boost AMD
[cpu]
governor=schedutil
energy_performance_preference=balance_performance
boost=1

[sysctl]
# Swappiness zram-friendly — géré ici car sysctl.d a 30, tuned confirme
vm.swappiness=30

# Note : kernel.sched_*_ns supprimés en 6.6+ (passage EEVDF, non exposés)

# --- Disque ---
# Readahead élevé pour SSD USB (lectures séquentielles streaming/paquets)
[disk]
readahead=>4096

# --- Audio ---
# Pas de mise en veille audio (évite les craquements au démarrage streaming)
[audio]
timeout=0

# --- Vidéo ---
# panel_power_savings=0 : pas de dimming sur secteur
# radeon_powersave=dpm-performance : GPU en mode performance (streaming/décodage vidéo)
# override de dpm-balanced hérité de balanced
[video]
panel_power_savings=0
radeon_powersave=dpm-performance, auto
